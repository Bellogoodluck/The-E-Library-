<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurelia Library — A Curated Archive of Knowledge</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  /* ============================
     DESIGN TOKENS
  ============================ */
  :root {
    --bg: #0D0D0D;
    --surface: #1A1A1A;
    --surface-2: #141414;
    --gold: #C9A227;
    --gold-soft: rgba(201, 162, 39, 0.15);
    --gold-glow: rgba(201, 162, 39, 0.35);
    --cream: #F5F0E6;
    --muted: #8A8A8A;
    --border: rgba(201, 162, 39, 0.25);
    --radius: 2px;
    --ease: 600ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Subtle grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  h1, h2, h3, h4 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  button, input, textarea, select {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }

  ::selection { background: var(--gold); color: var(--bg); }

  /* ============================
     NAVIGATION
  ============================ */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 22px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(13, 13, 13, 0.85);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    transition: var(--ease);
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream);
  }

  .nav-logo span { color: var(--gold); }

  .nav-links {
    display: flex;
    gap: 38px;
    list-style: none;
  }

  .nav-links a {
    color: var(--cream);
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    position: relative;
    padding-bottom: 6px;
    transition: color var(--ease);
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width var(--ease);
  }

  .nav-links a:hover { color: var(--gold); }
  .nav-links a:hover::after { width: 100%; }

  /* ============================
     HERO
  ============================ */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 120px 24px 60px;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(201, 162, 39, 0.12) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(201, 162, 39, 0.06) 0%, transparent 60%),
      var(--bg);
  }

  .hero-eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1s ease 0.2s forwards;
  }

  .hero h1 {
    font-size: clamp(52px, 9vw, 110px);
    line-height: 1;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1s ease 0.4s forwards;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--gold);
    font-weight: 500;
  }

  .hero-tagline {
    font-size: clamp(18px, 2vw, 24px);
    color: var(--muted);
    max-width: 560px;
    margin-bottom: 56px;
    font-style: italic;
    opacity: 0;
    animation: fadeUp 1s ease 0.6s forwards;
  }

  .hero-actions {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1s ease 0.8s forwards;
  }

  .btn {
    padding: 16px 44px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: var(--radius);
    transition: var(--ease);
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: inline-block;
  }

  .btn:hover {
    background: var(--gold);
    color: var(--bg);
    box-shadow: 0 0 30px var(--gold-glow);
  }

  .btn-filled {
    background: var(--gold);
    color: var(--bg);
  }

  .btn-filled:hover {
    background: #dcb532;
    box-shadow: 0 0 40px var(--gold-glow);
  }

  .scroll-indicator {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1s ease 1.2s forwards;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: pulse 2s ease infinite;
  }

  /* ============================
     SECTIONS
  ============================ */
  section {
    padding: 100px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .section-title {
    font-size: clamp(32px, 4vw, 48px);
    margin-bottom: 16px;
  }

  .section-subtitle {
    color: var(--muted);
    font-style: italic;
    font-size: 18px;
  }

  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ============================
     UPLOAD SECTION
  ============================ */
  .upload-container {
    max-width: 780px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 48px;
    border-radius: var(--radius);
  }

  .drop-zone {
    border: 1.5px dashed var(--border);
    padding: 56px 24px;
    text-align: center;
    cursor: pointer;
    transition: var(--ease);
    border-radius: var(--radius);
    margin-bottom: 32px;
    position: relative;
  }

  .drop-zone:hover,
  .drop-zone.dragover {
    border-color: var(--gold);
    background: var(--gold-soft);
    box-shadow: inset 0 0 40px var(--gold-soft), 0 0 30px var(--gold-soft);
  }

  .drop-zone-icon {
    font-size: 42px;
    color: var(--gold);
    margin-bottom: 16px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  .drop-zone h3 {
    font-size: 22px;
    margin-bottom: 10px;
  }

  .drop-zone p {
    color: var(--muted);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
  }

  .file-name {
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    margin-top: 12px;
    word-break: break-all;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-group.full { grid-column: 1 / -1; }

  .form-group label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 12px 16px;
    border-radius: var(--radius);
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    transition: var(--ease);
  }

  .form-group textarea { resize: vertical; min-height: 80px; }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 20px var(--gold-soft);
  }

  .upload-btn {
    width: 100%;
    margin-top: 8px;
  }

  .progress-wrap {
    height: 2px;
    background: var(--surface-2);
    margin-top: 20px;
    overflow: hidden;
    display: none;
  }

  .progress-wrap.active { display: block; }

  .progress-bar {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px var(--gold);
  }

  /* ============================
     TOAST
  ============================ */
  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--surface);
    border: 1px solid var(--gold);
    color: var(--cream);
    padding: 16px 28px;
    border-radius: var(--radius);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    transform: translateY(120%);
    transition: transform var(--ease);
    z-index: 500;
    box-shadow: 0 0 30px var(--gold-glow);
  }

  .toast.show { transform: translateY(0); }

  /* ============================
     SEARCH & FILTER
  ============================ */
  .search-section {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 48px;
  }

  .search-bar {
    max-width: 700px;
    margin: 0 auto 32px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 16px 20px 16px 52px;
    border-radius: var(--radius);
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    transition: var(--ease);
  }

  .search-bar input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 25px var(--gold-soft);
  }

  .search-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 18px;
  }

  .filter-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 48px;
  }

  .pill {
    padding: 9px 22px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 50px;
    transition: var(--ease);
  }

  .pill:hover { border-color: var(--gold); color: var(--gold); }

  .pill.active {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
    box-shadow: 0 0 20px var(--gold-glow);
  }

  /* ============================
     LIBRARY GRID
  ============================ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 32px;
  }

  .book-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: var(--ease);
    position: relative;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 0.8s ease forwards;
  }

  .book-card:hover {
    transform: translateY(-6px);
    border-color: var(--gold);
    box-shadow: 0 12px 40px rgba(201, 162, 39, 0.18);
  }

  .cover {
    aspect-ratio: 3/4;
    background: linear-gradient(150deg, #1a1a1a 0%, #2a2213 60%, #3d3016 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 26px 22px;
    border-bottom: 1px solid var(--border);
  }

  .cover::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid var(--border);
    pointer-events: none;
  }

  .cover-initials {
    font-family: 'Playfair Display', serif;
    font-size: 58px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    letter-spacing: 0.05em;
    text-shadow: 0 0 30px var(--gold-soft);
  }

  .cover-author {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.75;
    position: relative;
    z-index: 2;
  }

  .card-body { padding: 20px 22px 24px; }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    line-height: 1.3;
    margin-bottom: 8px;
    color: var(--cream);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-author {
    font-size: 15px;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 14px;
  }

  .card-badge {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 50px;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    opacity: 0;
    transform: translateY(6px);
    transition: var(--ease);
  }

  .book-card:hover .card-actions {
    opacity: 1;
    transform: translateY(0);
  }

  .action-btn {
    flex: 1;
    padding: 9px 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: var(--radius);
    transition: var(--ease);
  }

  .action-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .action-btn.danger:hover {
    border-color: #b33a3a;
    color: #e06c6c;
  }

  .empty-state {
    text-align: center;
    padding: 80px 24px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 24px;
    color: var(--muted);
  }

  /* ============================
     PDF VIEWER MODAL
  ============================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(10px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.active { display: flex; animation: fadeIn 0.4s ease; }

  .pdf-modal {
    width: 100%;
    max-width: 1100px;
    height: 92vh;
    background: var(--surface);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    transform: scale(0.95);
    animation: modalIn 0.4s ease forwards;
    box-shadow: 0 0 80px var(--gold-soft);
  }

  .pdf-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    flex-wrap: wrap;
    gap: 12px;
  }

  .pdf-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--cream);
    flex: 1;
    min-width: 150px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pdf-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pdf-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gold);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: var(--radius);
    font-size: 14px;
    transition: var(--ease);
  }

  .pdf-btn:hover { background: var(--gold); color: var(--bg); }
  .pdf-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .pdf-btn:disabled:hover { background: transparent; color: var(--gold); }

  .page-info {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--cream);
    letter-spacing: 0.1em;
    min-width: 70px;
    text-align: center;
  }

  .pdf-canvas-wrap {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    background: #0a0a0a;
  }

  #pdfCanvas {
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    max-width: 100%;
  }

  /* Delete confirmation */
  .confirm-modal {
    background: var(--surface);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 40px;
    max-width: 420px;
    text-align: center;
    transform: scale(0.95);
    animation: modalIn 0.3s ease forwards;
    box-shadow: 0 0 60px var(--gold-soft);
  }

  .confirm-modal h3 {
    font-size: 24px;
    margin-bottom: 14px;
  }

  .confirm-modal p {
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 16px;
  }

  .confirm-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .confirm-actions .btn {
    padding: 12px 30px;
    font-size: 11px;
  }

  /* ============================
     FOOTER
  ============================ */
  footer {
    text-align: center;
    padding: 60px 24px;
    border-top: 1px solid var(--border);
    margin-top: 80px;
  }

  footer p {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer .footer-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  /* ============================
     ANIMATIONS
  ============================ */
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes modalIn {
    to { transform: scale(1); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scaleY(0.7); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  /* ============================
     RESPONSIVE
  ============================ */
  @media (max-width: 900px) {
    nav { padding: 18px 24px; }
    .nav-links { display: none; }
    section { padding: 70px 24px; }
    .upload-container { padding: 32px 24px; }
    .form-grid { grid-template-columns: 1fr; }
    .search-section { padding: 0 24px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .cover-initials { font-size: 44px; }
  }

  @media (max-width: 480px) {
    .hero-actions { flex-direction: column; width: 100%; max-width: 280px; }
    .btn { width: 100%; text-align: center; }
    .grid { grid-template-columns: 1fr; }
  }

  /* Focus rings */
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<!-- NAVIGATION -->
<nav>
  <div class="nav-logo">Aurelia <span>Library</span></div>
  <ul class="nav-links">
    <li><a href="#hero">Home</a></li>
    <li><a href="#upload">Upload</a></li>
    <li><a href="#library">Collection</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-eyebrow">Est. MMXXV — A Private Collection</div>
  <h1>Aurelia <em>Library</em></h1>
  <p cla
